<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIY Guide - Hướng Dẫn Làm Đồ Tự Tay</title>
    <meta name="description" content="DIY Guide - Hướng dẫn làm đồ tự tay từ A-Z với các dự án DIY phong phú.">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #ff7a59;
            --dark: #1f2937;
            --muted: #6b7280;
            --bg: #f5f5f5;
            --white: #ffffff;
            --border: #e5e7eb;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #f5f5f5 0%, #eef2ff 100%);
            color: var(--dark);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-container {
            width: min(1200px, 100%);
            min-height: 100vh;
            background: var(--white);
            box-shadow: var(--shadow);
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--white);
            padding: 20px 24px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.25);
        }

        .header h1 {
            font-size: clamp(1.7rem, 2vw, 2.5rem);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 0.96rem;
            opacity: 0.9;
        }

        .main-content {
            padding: 20px;
        }

        .list-view,
        .detail-view {
            display: block;
        }

        .detail-view {
            display: none;
        }

        .hero {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--white);
            padding: 60px 20px;
            text-align: center;
            border-radius: 22px;
            margin-bottom: 22px;
            box-shadow: var(--shadow);
        }

        .hero h2 {
            font-size: clamp(2rem, 3vw, 3rem);
            margin-bottom: 10px;
            animation: fadeInDown 0.7s ease-out;
        }

        .hero p {
            font-size: 1.02rem;
            opacity: 0.97;
            animation: fadeInUp 0.7s ease-out 0.2s backwards;
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin: 0 auto 20px;
            max-width: 620px;
            padding: 0 8px;
        }

        .search-input {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 0.98rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
        }

        .search-btn,
        .back-btn,
        .send-btn,
        .action-buttons button {
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .search-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            padding: 12px 20px;
            min-width: 110px;
        }

        .search-btn:hover,
        .back-btn:hover,
        .send-btn:hover,
        .action-buttons button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(102, 126, 234, 0.2);
        }

        .projects-container {
            margin-top: 10px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 18px;
        }

        .project-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.08);
        }

        .project-card-img {
            width: 100%;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--white);
            font-weight: bold;
            position: relative;
        }

        .project-card-content {
            padding: 14px 12px 16px;
        }

        .project-card h3 {
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .project-meta {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            color: var(--muted);
            font-size: 0.8rem;
        }

        .detail-view {
            padding: 18px 20px 40px;
        }

        .back-btn {
            background: #eef2ff;
            color: var(--primary);
            padding: 10px 14px;
            margin-bottom: 20px;
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 26px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
        }

        .detail-emoji {
            width: 85px;
            height: 85px;
            min-width: 85px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.25);
        }

        .detail-info {
            flex: 1;
        }

        .detail-info h2 {
            font-size: clamp(1.6rem, 2vw, 2.2rem);
            margin-bottom: 10px;
        }

        .detail-info-row {
            color: var(--dark);
            font-size: 0.98rem;
            margin-bottom: 6px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin: 26px 0 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f1f5f9;
        }

        .materials-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
        }

        .material-item {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
        }

        .material-item strong {
            display: block;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .material-item span {
            display: block;
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .steps-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .step-item {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .step-item h4 {
            font-size: 1.02rem;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .chatbot-section {
            background: #fafafa;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
        }

        .chat-box {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            height: 260px;
            overflow-y: auto;
            padding: 12px;
            margin-bottom: 12px;
        }

        .chat-message {
            padding: 10px 12px;
            margin-bottom: 10px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 0.94rem;
        }

        .chat-message.user {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            margin-left: auto;
            text-align: left;
        }

        .chat-message.bot {
            background: #f3f4f6;
            border: 1px solid var(--border);
            color: var(--dark);
        }

        .chat-input-group {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 0.96rem;
            outline: none;
        }

        .chat-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
        }

        .send-btn {
            background: var(--dark);
            color: var(--white);
            padding: 12px 18px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 26px;
        }

        .action-buttons button {
            background: linear-gradient(135deg, #111827, #374151);
            color: var(--white);
            padding: 12px 18px;
        }

        .empty-state {
            text-align: center;
            color: var(--muted);
            padding: 32px 16px;
            font-size: 1rem;
            background: #f8fafc;
            border: 1px dashed var(--border);
            border-radius: 12px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 14px;
            }

            .hero {
                padding: 42px 18px;
            }

            .search-box,
            .chat-input-group {
                flex-direction: column;
            }

            .detail-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .project-card-img {
                height: 130px;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1>🛠️ DIY Guide</h1>
        <p>Hướng dẫn làm đồ tự tay từ A-Z</p>
    </div>

    <div class="main-content">
        <div id="listView" class="list-view">
            <div class="hero">
                <h2>✨ Khám Phá DIY Hiện Đại</h2>
                <p>Từ loa Bluetooth đến máy phát điện - tất cả ở đây!</p>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="VD: loa, led, bàn, camera...">
                <button class="search-btn" onclick="handleSearch()">🔍 Tìm</button>
            </div>

            <div class="projects-container">
                <div class="projects-grid" id="projectsGrid"></div>
            </div>
        </div>

        <div id="detailView" class="detail-view">
            <button class="back-btn" onclick="goBack()">← Quay Lại</button>

            <div class="detail-header">
                <div class="detail-emoji" id="detailEmoji"></div>
                <div class="detail-info">
                    <h2 id="detailName"></h2>
                    <div class="detail-info-row">⏱️ <span id="detailTime"></span></div>
                    <div class="detail-info-row">💰 <span id="detailCost"></span></div>
                    <div class="detail-info-row">⭐ <span id="detailDifficulty"></span></div>
                </div>
            </div>

            <div class="section-title">📋 Danh Sách Vật Liệu</div>
            <div id="materialsDiv" class="materials-list"></div>

            <div class="section-title">📖 Hướng Dẫn Chi Tiết</div>
            <div id="stepsDiv" class="steps-list"></div>

            <div class="section-title">🤖 Hỏi Đáp</div>
            <div class="chatbot-section">
                <div class="chat-box" id="chatBox"></div>
                <div class="chat-input-group">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Nhập câu hỏi...">
                    <button class="send-btn" onclick="sendChat()">Gửi</button>
                </div>
            </div>

            <div class="action-buttons">
                <button onclick="alert('Chức năng in sẽ ra mắt sớm!')">🖨️ In</button>
                <button onclick="alert('Chức năng tải sẽ ra mắt sớm!')">📥 Tải</button>
                <button onclick="alert('Chức năng chia sẻ sẽ ra mắt sớm!')">📤 Chia Sẻ</button>
            </div>
        </div>
    </div>
</div>

            materials: [

                { name: "Bộ đèn LED", qty: "1", price: "180K", store: "Shopee" },
                { name: "Khung nhôm", qty: "1", price: "120K", store: "Cửa hàng điện" },
                { name: "Bóng đèn 12V", qty: "2", price: "80K", store: "Shopee" }
            ],
            steps: [
                { title: "Bước 1", desc: "Đo chiều dài và cắt khung nhôm theo kích thước phòng." },
                { title: "Bước 2", desc: "Lắp bộ LED và kiểm tra nguồn điện 12V." },
                { title: "Bước 3", desc: "Tạo vị trí treo và gắn chắc chắn lên trần." },
                { title: "Bước 4", desc: "Kiểm tra độ sáng và chỉnh góc phản quang." }
            ]
        },
        "ban-laptop": {
            name: "Bàn Laptop Gỗ Mini",
            emoji: "💻",
            color: "linear-gradient(135deg, #6a5af9, #8d6efb)",
            time: "5-7 giờ",
            cost: "1M - 1.8M VND",
            difficulty: "Trung bình",
            materials: [
                { name: "Gỗ MDF", qty: "2 tấm", price: "500K", store: "Cửa hàng gỗ" },
                { name: "Keo dán gỗ", qty: "1 hộp", price: "80K", store: "Bách hóa" },
                { name: "Ốc vít", qty: "12", price: "40K", store: "Bách hóa" },
                { name: "Sơn phủ", qty: "1 lọ", price: "120K", store: "Cửa hàng sơn" }
            ],
            steps: [
                { title: "Bước 1", desc: "Vẽ kích thước và cắt các tấm gỗ theo thiết kế." },
                { title: "Bước 2", desc: "Gắn khung và kiểm tra độ cân bằng của mặt bàn." },
                { title: "Bước 3", desc: "Sơn phủ lớp bảo vệ và chờ khô." },
                { title: "Bước 4", desc: "Lắp chân bàn và tinh chỉnh độ chắc chắn." }
            ]
        },
        "camera-mini": {
            name: "Camera An Ninh Mini DIY",
            emoji: "📷",
            color: "linear-gradient(135deg, #2ec4b6, #1a9bb8)",
            time: "3-5 giờ",
            cost: "700K - 1.2M VND",
            difficulty: "Khó",
            materials: [
                { name: "Module camera IP", qty: "1", price: "500K", store: "Shopee" },
                { name: "Vỏ nhựa ABS", qty: "1", price: "120K", store: "Cửa hàng điện" },
                { name: "Ống dẫn dây", qty: "1", price: "80K", store: "Bách hóa" },
                { name: "Bộ nguồn 12V", qty: "1", price: "150K", store: "Shopee" }
            ],
            steps: [
                { title: "Bước 1", desc: "Lắp camera vào vỏ bảo vệ và kiểm tra góc quay." },
                { title: "Bước 2", desc: "Rà soát dây nguồn và hệ thống kết nối tín hiệu." },
                { title: "Bước 3", desc: "Tạo vị trí gắn trên tường với góc quan sát tốt." },
                { title: "Bước 4", desc: "Check feed và cài đặt vùng giám sát." }
            ]
        },
        "bo-nuoc": {
            name: "Bộ Lọc Nước Tự Làm",
            emoji: "🚰",
            color: "linear-gradient(135deg, #00b894, #00cec9)",
            time: "2-4 giờ",
            cost: "300K - 600K VND",
            difficulty: "Trung bình",
            materials: [
                { name: "Bình nhựa 20L", qty: "1", price: "120K", store: "Bách hóa" },
                { name: "Lõi lọc", qty: "2", price: "180K", store: "Shopee" },
                { name: "Vỏ đầu lọc", qty: "1", price: "90K", store: "Bách hóa" },
                { name: "Ống dẫn nước", qty: "1 bộ", price: "80K", store: "Bách hóa" }
            ],
            steps: [
                { title: "Bước 1", desc: "Làm sạch bình và kiểm tra khả năng chịu áp suất." },
                { title: "Bước 2", desc: "Lắp các lõi lọc đúng thứ tự và khớp kín." },
                { title: "Bước 3", desc: "Nối ống dẫn từ đầu vào tới đầu ra." },
                { title: "Bước 4", desc: "Kiểm tra lưu lượng và vệ sinh định kỳ." }
            ]
        },
        "may-phat-dien": {
            name: "Máy Phát Điện Mini",
            emoji: "⚡",
            color: "linear-gradient(135deg, #ff7675, #e84393)",
            time: "8-12 giờ",
            cost: "2M - 4M VND",
            difficulty: "Khó",
            materials: [
                { name: "Động cơ điện", qty: "1", price: "1.2M", store: "Shopee" },
                { name: "Bộ máy phát", qty: "1", price: "900K", store: "Thương mại" },
                { name: "Bảng điều khiển", qty: "1", price: "400K", store: "Shopee" },
                { name: "Khung sắt", qty: "1", price: "600K", store: "Cửa hàng sắt" }
            ],
            steps: [
                { title: "Bước 1", desc: "Thiết kế khung cố định và vị trí động cơ." },
                { title: "Bước 2", desc: "Lắp khớp truyền động và dây dẫn điện." },
                { title: "Bước 3", desc: "Kết nối bảng điều khiển và kiểm tra mạch điện." },
                { title: "Bước 4", desc: "Thử tải, đo điện áp và điều chỉnh vòng bi." }
            ]
        }
    };

    var currentProjectKey = '';
    var chatHistory = [];

    function displayProjects(filterText) {
        var grid = document.getElementById('projectsGrid');
        grid.innerHTML = '';

        var normalized = (filterText || '').trim().toLowerCase();
        var keys = Object.keys(projects);

        var filtered = keys.filter(function(key) {
            var p = projects[key];
            if (!normalized) return true;
            return (
                p.name.toLowerCase().includes(normalized) ||
                p.difficulty.toLowerCase().includes(normalized) ||
                (p.materials || []).some(function(material) {
                    return material.name.toLowerCase().includes(normalized);
                })
            );
        });

        if (!filtered.length) {
            grid.innerHTML = '<div class="empty-state">Không tìm thấy dự án phù hợp. Hãy thử từ khóa khác như: loa, led, bàn, camera.</div>';
            return;
        }

        filtered.forEach(function(key) {
            var project = projects[key];
            var card = document.createElement('div');
            card.className = 'project-card';
            card.onclick = function() {
                openProject(key);
            };

            card.innerHTML = `
                <div class="project-card-img" style="background: ${project.color};">${project.emoji}</div>
                <div class="project-card-content">
                    <h3>${project.name}</h3>
                    <div class="project-meta">
                        <span>⏱️ ${project.time}</span>
                        <span>💰 ${project.cost}</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function handleSearch() {
        var input = document.getElementById('searchInput');
        displayProjects(input.value);
    }

    function openProject(key) {
        currentProjectKey = key;
        chatHistory = [];

        var project = projects[key];
        document.getElementById('detailEmoji').textContent = project.emoji;
        document.getElementById('detailName').textContent = project.name;
        document.getElementById('detailTime').textContent = project.time;
        document.getElementById('detailCost').textContent = project.cost;
        document.getElementById('detailDifficulty').textContent = project.difficulty;

        var materialsDiv = document.getElementById('materialsDiv');
        materialsDiv.innerHTML = '';
        project.materials.forEach(function(item) {
            var card = document.createElement('div');
            card.className = 'material-item';
            card.innerHTML = `
                <strong>${item.name}</strong>
                <span>SL: ${item.qty}</span>
                <span>Giá: ${item.price}</span>
                <span>Kho: ${item.store}</span>
            `;
            materialsDiv.appendChild(card);
        });

        var stepsDiv = document.getElementById('stepsDiv');
        stepsDiv.innerHTML = '';
        project.steps.forEach(function(step) {
            var stepItem = document.createElement('div');
            stepItem.className = 'step-item';
            stepItem.innerHTML = `
                <h4>${step.title}</h4>
                <p>${step.desc}</p>
            `;
            stepsDiv.appendChild(stepItem);
        });

        var chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        appendBotMessage('Xin chào! Tôi có thể giúp bạn về dự án này. Hãy hỏi về vật liệu, cách lắp, hoặc mức độ khó.');

        document.getElementById('listView').style.display = 'none';
        document.getElementById('detailView').style.display = 'block';
    }

    function goBack() {
        document.getElementById('detailView').style.display = 'none';
        document.getElementById('listView').style.display = 'block';
        document.getElementById('chatInput').value = '';
    }

    function appendBotMessage(text) {
        var box = document.getElementById('chatBox');
        var msg = document.createElement('div');
        msg.className = 'chat-message bot';
        msg.textContent = text;
        box.appendChild(msg);
        box.scrollTop = box.scrollHeight;
    }

    function appendUserMessage(text) {
        var box = document.getElementById('chatBox');
        var msg = document.createElement('div');
        msg.className = 'chat-message user';
        msg.textContent = text;
        box.appendChild(msg);
        box.scrollTop = box.scrollHeight;
    }

    function sendChat() {
        var input = document.getElementById('chatInput');
        var message = input.value.trim();
        if (!message) return;

        appendUserMessage(message);
        chatHistory.push({ role: 'user', content: message });
        input.value = '';

        var botLoading = document.createElement('div');
        botLoading.className = 'chat-message bot';
        botLoading.textContent = '💭 Đang suy nghĩ...';
        document.getElementById('chatBox').appendChild(botLoading);
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;

        setTimeout(function() {
            var answer = getLocalAnswer(message);
            botLoading.textContent = answer;
            chatHistory.push({ role: 'assistant', content: answer });
        }, 350);
    }

    function getLocalAnswer(userMsg) {
        var project = projects[currentProjectKey];
        if (!project) {
            return 'Vui lòng mở một dự án để được hỗ trợ.';
        }

        var msg = userMsg.toLowerCase();

        if (msg.includes('vật liệu') || msg.includes('dụng cụ') || msg.includes('nguyên liệu')) {
            return 'Dự án "' + project.name + '" cần: ' + project.materials.map(function(m) { return m.name; }).join(', ') + '.';
        }

        if (msg.includes('khó') || msg.includes('mức độ') || msg.includes('độ khó')) {
            return 'Mức độ khó của dự án này là ' + project.difficulty + '. Nên phù hợp cho người mới bắt đầu nếu làm cẩn thận.';
        }

        if (msg.includes('thời gian') || msg.includes('mất bao lâu') || msg.includes('bao lâu')) {
            return 'Bạn sẽ mất khoảng ' + project.time + ' để hoàn thành dự án này.';
        }

        if (msg.includes('chi phí') || msg.includes('giá tiền') || msg.includes('tốn bao nhiêu')) {
            return 'Chi phí ước tính là ' + project.cost + ' tùy theo địa điểm mua hàng và chất lượng vật liệu.';
        }

        if (msg.includes('bước 1') || msg.includes('bắt đầu') || msg.includes('cách làm')) {
            return 'Nên bắt đầu từ: "' + project.steps[0].desc + '". Sau đó làm theo thứ tự từng bước ở mục Hướng dẫn chi tiết.';
        }

        if (msg.includes('pin') || msg.includes('điện') || msg.includes('an toàn')) {
            return 'Lưu ý: luôn ngắt nguồn điện khi lắp nối, kiểm tra dây dẫn và đeo găng tay khi làm việc với kim loại hoặc điện.';
        }

        if (msg.includes('sơn') || msg.includes('hoàn thiện') || msg.includes('trang trí')) {
            return 'Nên sơn sau khi lắp chắc chắn, chờ khô hoàn toàn trước khi sử dụng để đảm bảo bề mặt đẹp và bền.';
        }

        if (msg.includes('làm sao') || msg.includes('giúp') || msg.includes('câu hỏi')) {
            return 'Bạn có thể hỏi tôi về: vật liệu, thời gian, chi phí, độ khó, cách lắp, hoặc công việc bảo quản cho dự án này.';
        }

        return 'Theo dự án "' + project.name + '", tôi khuyên bạn nên làm theo từng bước trong phần Hướng dẫn chi tiết, ưu tiên kiểm tra vật liệu và an toàn trước khi bắt đầu.';
    }

    document.getElementById('searchInput').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            handleSearch();
        }
    });

    document.getElementById('chatInput').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            sendChat();
        }
    });

    displayProjects();
</script>
</body>
</html>
